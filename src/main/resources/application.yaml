server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: hub-hakye
    access-ttl-minutes: 60
  cors:
    allowed-origin: http://localhost:3000
  storage:
    account-id: ${R2_ACCOUNT_ID}
    bucket: ${R2_BUCKET}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    public-base-url: ${R2_PUBLIC_BASE_URL}
    presign-expiry-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always