server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: hub-hakye
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  refresh-cookie:
    name: refresh_token
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    path: /api/auth
  rate-limit:
    login:
      window: 15m
      max-attempts-per-account: 5
      max-attempts-per-ip: 30
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  storage:
    account-id: ${R2_ACCOUNT_ID}
    bucket: ${R2_BUCKET}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    public-base-url: ${R2_PUBLIC_BASE_URL}
    presign-expiry-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false