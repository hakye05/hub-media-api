server:
  port: 8080

spring:
  application:
    name: api
  security:
    user:
      name: ${SWAGGER_USER}
      password: ${SWAGGER_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always